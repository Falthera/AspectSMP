name: AspectSMP
main: com.aspectsmp.AspectSMP
version: 1.0.0-SNAPSHOT
api-version: 1.21
author: Aspect SMP Team
description: Ability-based PvP RPG survival system
commands:
  aspect-give:
    description: Give Heart item
    usage: /<command> <player> <catalyst|resonator|restoration|reforging>
  give-event-aspect:
    description: Give an event aspect to a player
    usage: /<command> <player> <cloud|winter>
    permission: aspect.admin
  event:
    description: Manage server events
    usage: /<command> <event_name>
    permission: aspect.admin
  info:
    description: View Heart info
    usage: /<command> [player]
  list:
    description: List all Aspects
    usage: /<command>
  ability1:
    description: Use Tier 1 ability
    usage: /<command>
  ability2:
    description: Use Tier 2 ability
    usage: /<command>
  ability3:
    description: Use Tier 3 ability
    usage: /<command>
  ultimate:
    description: Use Ultimate ability
    usage: /<command>
  reroll:
    description: Reroll Aspect
    usage: /<command> <player>
  repair:
    description: Repair Heart
    usage: /<command> <player>
  reload:
    description: Reload plugin
    usage: /<command>
  trust:
    description: Manage trusted players
    usage: /<command> <add|remove|clear|list> [name]
permissions:
  aspect.use:
    description: Access to basic aspect commands
    default: true
  aspect.admin:
    description: Admin access to aspect commands
    default: op
