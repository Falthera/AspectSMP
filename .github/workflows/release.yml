name: Build and Release

on:
  push:
    branches:
      - main
      - master
  create:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'New version (e.g., 1.0.0)'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Build with Maven
        run: mvn -B package --file pom.xml
        
      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aspect-smp
          path: target/*.jar
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: aspect-smp
          
      - name: Get version
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi
          
      - name: Bump patch version
        run: |
          VERSION="${{ steps.tag.outputs.VERSION }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.tag.outputs.VERSION }}
          name: Release v${{ steps.tag.outputs.VERSION }}
          files: target/*.jar
          body: |
            ## Aspect SMP v${{ steps.tag.outputs.VERSION }}
            
            ### Features
            - 8 Aspect classes with 4 abilities each (32 total)
            - Heart system with Tier 1-3 progression
            - Stability system (90-100 Awakened → 0 Dormant)
            - Essence currency system
            - PersistentDataContainer item system
            - SQLite/MySQL/YAML storage backends
            - Event-driven rule modifiers
            
            ### Compatibility
            - Purpur 1.21.11
            - Paper compatible
          draft: false
          prerelease: false
          generate_release_notes: true