name: Build and Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      version:
        description: 'New version (e.g., 1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          
       - name: Bump version
         id: bump
         run: |
           LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
           CURRENT=${LATEST_TAG#v}
           if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
             NEW_VERSION="${{ github.event.inputs.version }}"
           else
             IFS='.' read -ra PARTS <<< "$CURRENT"
             NEW_VERSION="${PARTS[0]}.${PARTS[1]}.$((PARTS[2] + 1))"
           fi
           echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
           echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV
      
      - name: Build with Maven
        run: mvn -B package --file pom.xml
        
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aspect-smp
          path: target/*.jar
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: aspect-smp
      
      - name: Create Release Tag
        id: tag
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin "v${{ steps.bump.outputs.version }}"
          
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.version }}
          name: Release v${{ steps.bump.outputs.version }}
          files: target/*.jar
          body: |
            ## Aspect SMP v${{ steps.bump.outputs.version }}
            
            ### Features
            - 8 Aspect classes with 4 abilities each (32 total)
            - Heart system with Tier 1-3 progression
            - Stability system (90-100 Awakened → 0 Dormant)
            - Essence currency system
            - PersistentDataContainer item system
            - SQLite/MySQL/YAML storage backends
            - Event-driven rule modifiers
            
            ### Compatibility
            - Paper 1.21.11
          draft: false
          prerelease: false
          generate_release_notes: true