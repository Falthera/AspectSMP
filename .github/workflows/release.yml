name: Build and Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      version:
        description: 'New version (e.g., 1.0.0)'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Extract version
        id: version
        run: |
          VERSION=$(mvn -q -Dexec.executable=echo help:evaluate -DforceStdout | grep -v "^\[")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
      
      - name: Build with Maven
        run: mvn -B package --file pom.xml
        
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aspect-smp
          path: target/*.jar
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: aspect-smp
      
      - name: Create/Update Release Tag
        id: tag
        run: |
          NEW_VERSION="${{ github.event.inputs.version }}"
          if [[ -n "$NEW_VERSION" ]]; then
            VERSION="$NEW_VERSION"
          else
            MAJOR=$(echo "${{ github.ref_name }}" | cut -d. -f1)
            MINOR=$(echo "${{ github.ref_name }}" | cut -d. -f2)
            PATCH=$(echo "${{ github.ref_name }}" | cut -d. -f3)
            PATCH=$((PATCH + 1))
            VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git tag "v$VERSION"
          git push origin "v$VERSION"
          
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.tag.outputs.VERSION }}
          name: Release v${{ steps.tag.outputs.VERSION }}
          files: target/*.jar
          body: |
            ## Aspect SMP v${{ steps.tag.outputs.VERSION }}
            
            ### Features
            - 8 Aspect classes with 4 abilities each (32 total)
            - Heart system with Tier 1-3 progression
            - Stability system (90-100 Awakened → 0 Dormant)
            - Essence currency system
            - PersistentDataContainer item system
            - SQLite/MySQL/YAML storage backends
            - Event-driven rule modifiers
            
            ### Compatibility
            - Paper 1.21.1
            - Purpur compatible
          draft: false
          prerelease: false
          generate_release_notes: true