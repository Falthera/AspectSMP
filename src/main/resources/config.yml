# ================================================================================
# STORAGE CONFIGURATION
# ================================================================================
storage:
  type: sqlite                          # Options: sqlite, mysql
  mysql:
    host: localhost
    port: 3306
    database: aspectsmp
    username: root
    password: ""

# ================================================================================
# COOLDOWN CONFIGURATION (milliseconds)
# ================================================================================
cooldowns:
  base: 5000
  tier1: 5000
  tier2: 8000
  tier3: 12000
  ultimate: 30000

  # Per-ability overrides
  abilities:
    inferno:
      flame_step: 4000
      lava_burst: 6000
      infernal_chains: 10000
      sun_core_collapse: 25000
    tide:
      hydro_push: 4000
      tidal_prison: 8000
      ocean_surge: 10000
      maelstrom: 25000
    tempest:
      dash_chain: 3000
      static_bolt: 5000
      storm_rush: 8000
      thunder_execution: 25000
    rift:
      blink: 3000
      void_swap: 8000
      dimensional_tear: 12000
      reality_collapse: 30000
    vitality:
      heal_pulse: 6000
      life_link: 10000
      revival_shield: 20000
      genesis_field: 30000
    war:
      berserk_slash: 4000
      rage_mode: 15000
      execution_chain: 12000
      war_god_state: 30000
    cosmos:
      gravity_pull: 8000
      orbital_shield: 15000
      meteor_call: 20000
      black_star_collapse: 30000
    fortune:
      lucky_strike: 5000
      ore_sense: 10000
      mining_rush: 15000
      kings_jackpot: 30000
    cloud:
      air_walker: 5000
      inhale: 10000
      tempest_cage: 15000
      cloudburst: 25000
    winter:
      icicles: 4000
      cold_snap: 8000
      shatter: 12000
      absolute_zero: 25000
    shadow:
      shadow_step: 3000
      umbral_blades: 8000
      shadow_meld: 15000
      void_reaper: 25000
    storm:
      wind_step: 3000
      gale_force: 8000
      cyclone: 15000
      tempest_avatar: 25000

# ================================================================================
# STABILITY & ESSENCE CONFIGURATION
# ================================================================================
stability:
  kill_bonus: 5
  death_penalty: 10

essence:
  pvp_kill: 10
  combat_damage: 2

# ================================================================================
# FEATURE TOGGLES
# ================================================================================
features:
  obfuscated-death-messages: true
  unlimited-villager-trading: true
  explosion-proof-items: true

# ================================================================================
# VISUAL EFFECTS CONFIGURATION
# ================================================================================
visual-effects:
  enabled: true
  particle-quality: 3  # 1=Minimal, 2=Low, 3=Medium, 4=High, 5=Ultra

  # Quality level presets
  particle-quality-levels:
    1:
      name: "Minimal"
      max-particles: 10
      trails: false
      orbit: false
      ambient: false
      impacts: true
      ultimates: true
    2:
      name: "Low"
      max-particles: 25
      trails: true
      orbit: false
      ambient: false
      impacts: true
      ultimates: true
    3:
      name: "Medium"
      max-particles: 50
      trails: true
      orbit: true
      ambient: true
      impacts: true
      ultimates: true
    4:
      name: "High"
      max-particles: 100
      trails: true
      orbit: true
      ambient: true
      impacts: true
      ultimates: true
      chromatic: true
      vignette: true
    5:
      name: "Ultra"
      max-particles: 200
      trails: true
      orbit: true
      ambient: true
      impacts: true
      ultimates: true
      chromatic: true
      vignette: true
      screen-shake: true

  # Performance settings
  max-particles-per-tick: 150
  max-particles-per-effect: 40
  max-view-distance: 40.0

  # Effect toggles
  screen-shake: true
  vignette: true
  chromatic-aberration: true
  affect-pvp: false
  ambient-sounds: true
  passive-aura: true
  orbit-particles: true
  movement-trails: true
  ability-charge-effects: true
  impact-effects: true
  ultimate-effects: true
  kill-effects: true
  death-effects: true
  event-effects: true
  tier-up-effects: true
  stability-effects: true
  use-particle-builder: true
  use-trail-particles: true
  sound-seed-enabled: true

# ================================================================================
# RESOURCE PACK CONFIGURATION
# ================================================================================
resource-pack:
  enabled: true
  url: "https://github.com/Falthera/AspectSMP/releases/download/Resource-Pack/AspectSMP-Pack.zip"
  sha256: "a28d59cdbb15c19c4e828849310c4cf11496c12af17d2b63b7db373110612c7a"
  required: true
  prompt-message: "§b§lAspect SMP §7This resource pack is essential for the plugin to work correctly. It provides custom item textures, GUI elements, and visual effects."
  auto-download: true

# ================================================================================
# MUSIC CONFIGURATION
# ================================================================================
music:
  enabled: true
  volume: 0.5
  fade-duration: 3
  crossfade-enabled: true
  default-playlist: "ambient"
  playlists:
    ambient:
      - "aspect_smp_theme"
    combat:
      - "aspect_smp_theme"
    event:
      - "aspect_smp_theme"

# ══════════════════════════════════════════════════════════════════════════════════
# END OF CONFIGURATION
# ══════════════════════════════════════════════════════════════════════════════════