storage:
  type: sqlite
  mysql:
    host: localhost
    port: 3306
    database: aspectsmp
    username: root
    password: ""

cooldowns:
  base: 5000

stability:
  kill_bonus: 5
  death_penalty: 10

essence:
  pvp_kill: 10
  combat_damage: 2

features:
  obfuscated-death-messages: true
  unlimited-villager-trading: true
  explosion-proof-items: true

visual-effects:
  enabled: true
  particle-quality: 3
  screen-shake: true
  vignette: true
  chromatic-aberration: true
  affect-pvp: false
  ambient-sounds: true
  passive-aura: true
  orbit-particles: true
  movement-trails: true
  ability-charge-effects: true
  impact-effects: true
  ultimate-effects: true
  kill-effects: true
  death-effects: true
  event-effects: true
  tier-up-effects: true
  stability-effects: true
  use-particle-builder: true
  use-trail-particles: true
  sound-seed-enabled: true

resource-pack:
  enabled: true
  url: ""
  sha256: ""
  required: false
  prompt-message: "§b§lAspect SMP §7requires a resource pack for custom items and effects."
  auto-download: true

music:
  enabled: true
  volume: 0.5
  fade-duration: 3
  crossfade-enabled: true
  default-playlist: "ambient"
  playlists:
    ambient:
      - "aspect_smp_theme"
    combat:
      - "aspect_smp_theme"
    event:
      - "aspect_smp_theme"