name: AspectSMP
main: com.aspectsmp.AspectSMP
version: 1.0.0-SNAPSHOT
api-version: 1.21
author: Aspect SMP Team
description: Ability-based PvP RPG survival system
commands:
  aspect-give:
    description: Give Heart item
    usage: /<command> <player> <catalyst|resonator|restoration|reforging>
  give-event-aspect:
    description: Give an event aspect to a player
    usage: /<command> <player> <cloud|winter>
    permission: aspect.admin
  event:
    description: Manage server events
    usage: /<command> <event_name>
    permission: aspect.admin
  info:
    description: View Heart info
    usage: /<command> [player]
  list:
    description: List all Aspects
    usage: /<command>
  ability1:
    description: Use Tier 1 ability
    usage: /<command>
  ability2:
    description: Use Tier 2 ability
    usage: /<command>
  ability3:
    description: Use Tier 3 ability
    usage: /<command>
  ultimate:
    description: Use Ultimate ability
    usage: /<command>
  reroll:
    description: Reroll Aspect
    usage: /<command> <player>
    permission: aspect.admin
  repair:
    description: Repair Heart
    usage: /<command> <player>
    permission: aspect.admin
  reload:
    description: Reload plugin
    usage: /<command>
    permission: aspect.admin
  trust:
    description: Manage trusted players
    usage: /<command> <add|remove|clear|list> [name]
  withdraw:
    description: Withdraw stability from your Heart
    usage: /<command> stability
  leaveevent:
    description: Leave the active Ninth Sky event
    usage: /<command>
  eclipse:
    description: Join the Frozen Eclipse event
    usage: /<command>
  shadow:
    description: Join the Shadow's Descent event
    usage: /<command>
  tempest:
    description: Join the Tempest's Fury event
    usage: /<command>
  team:
    description: Manage teams
    usage: /<command> <create|invite|join|leave|kick|disband|info|list> [args]
  particles:
    description: Configure particle quality settings
    usage: /<command> [quality|toggle|reset|help]
permissions:
  aspect.use:
    description: Access to basic aspect commands
    default: true
  aspect.admin:
    description: Admin access to aspect commands
    default: op

# Visual Effects Configuration
visual-effects:
  enabled: true
  particle-quality: 3  # 1=low, 2=medium, 3=high, 4=ultra
  screen-shake: true
  vignette: true
  chromatic-aberration: true
  affect-pvp: false  # When false, screen effects don't modify player view/movement (PvP safe)
  ambient-sounds: true
  passive-aura: true
  orbit-particles: true
  movement-trails: true
  ability-charge-effects: true
  impact-effects: true
  ultimate-effects: true
  kill-effects: true
  death-effects: true
  event-effects: true
  tier-up-effects: true
  stability-effects: true
